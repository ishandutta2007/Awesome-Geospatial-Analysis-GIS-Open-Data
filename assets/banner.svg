<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Map Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .sat-orbit {
        animation: rotateOrbit 25s linear infinite;
        transform-origin: 980px 210px;
      }
      .pulse-radar {
        animation: pulseRing 4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        transform-origin: 980px 210px;
      }
      .pulse-radar-delay {
        animation: pulseRing 4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite 2s;
        transform-origin: 980px 210px;
      }
      .floating-pill {
        animation: floatPill 6s ease-in-out infinite alternate;
      }
      .floating-pill-rev {
        animation: floatPillRev 7s ease-in-out infinite alternate;
      }
      .grid-wave {
        animation: gridMove 20s linear infinite;
      }
      .coord-text {
        font-family: 'SF Mono', Consolas, Monaco, monospace;
        font-size: 11px;
        fill: #38bdf8;
        opacity: 0.7;
      }
      @keyframes rotateOrbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseRing {
        0% { r: 30px; opacity: 0.8; stroke-width: 2.5; }
        50% { opacity: 0.4; }
        100% { r: 160px; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes floatPill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatPillRev {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
    </style>
  </defs>

  <!-- Deep Cosmic / Ocean Geospatial Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Cartographic Coordinate Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Background Animated Glowing Nebulae/Rings -->
  <circle cx="980" cy="210" r="140" fill="url(#glowGrad)"/>
  
  <!-- Dynamic Radar Scanning Rings -->
  <circle class="pulse-radar" cx="980" cy="210" r="40" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <circle class="pulse-radar-delay" cx="980" cy="210" r="40" fill="none" stroke="#10b981" stroke-width="1.5"/>

  <!-- Globe Longitude/Latitude Vectors in Background -->
  <g opacity="0.4" transform="translate(980, 210)">
    <circle r="120" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,4"/>
    <ellipse rx="120" ry="45" fill="none" stroke="#0ea5e9" stroke-width="1.2"/>
    <ellipse rx="45" ry="120" fill="none" stroke="#0ea5e9" stroke-width="1.2"/>
    <circle r="8" fill="#38bdf8" filter="url(#glow)"/>
    <circle r="3" fill="#ffffff"/>
  </g>

  <!-- Satellite Orbiting Mechanism -->
  <g class="sat-orbit">
    <!-- Satellite Icon & Sensor Beam -->
    <g transform="translate(980, 90)">
      <polygon points="0,0 -30,60 30,60" fill="#38bdf8" fill-opacity="0.12"/>
      <rect x="-10" y="-6" width="20" height="12" rx="2" fill="#e2e8f0"/>
      <rect x="-24" y="-3" width="10" height="6" rx="1" fill="#38bdf8"/>
      <rect x="14" y="-3" width="10" height="6" rx="1" fill="#38bdf8"/>
      <circle cx="0" cy="0" r="2" fill="#ef4444"/>
    </g>
  </g>

  <!-- Decorative Geospatial Nodes & Vectors (Top Left / Right) -->
  <path d="M 60 40 L 140 40 L 180 80 L 320 80" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,4"/>
  <circle cx="60" cy="40" r="3.5" fill="#38bdf8"/>
  <circle cx="180" cy="80" r="3.5" fill="#10b981"/>
  <circle cx="320" cy="80" r="3.5" fill="#38bdf8"/>
  <text x="60" y="30" class="coord-text">LAT 37° 46' N  LON 122° 25' W  |  EPSG:4326</text>

  <!-- Left Main Foreground Content Area -->
  <g transform="translate(60, 140)" filter="url(#subtleShadow)">
    
    <!-- Top Category Tag -->
    <g transform="translate(0, -32)">
      <rect width="210" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="13" r="5" fill="#10b981"/>
      <text x="28" y="17.5" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="0.8">GEOSPATIAL &amp; GIS DATA</text>
    </g>

    <!-- Banner Main Title -->
    <text x="0" y="32" class="title-text">
      Awesome Geospatial Analysis
    </text>

    <!-- Subtitle / Highlight Bar -->
    <text x="0" y="74" class="subtitle-text">
      Curated GIS Platforms, Spatial Data Science &amp; Earth Observation
    </text>

    <!-- Feature Tech Pills (Dynamic Float) -->
    <g transform="translate(0, 115)" class="floating-pill">
      <!-- Pill 1: Web Mapping -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.2"/>
        <text x="14" y="22" class="badge-text">🗺️ Web Mapping</text>
      </g>
      <!-- Pill 2: Cloud GIS -->
      <g transform="translate(155, 0)">
        <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="14" y="22" class="badge-text">☁️ Cloud GIS</text>
      </g>
      <!-- Pill 3: Earth Observation -->
      <g transform="translate(295, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
        <text x="14" y="22" class="badge-text">🛰️ Earth Observation</text>
      </g>
      <!-- Pill 4: Open Data -->
      <g transform="translate(485, 0)">
        <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2"/>
        <text x="14" y="22" class="badge-text">🌐 Open Data</text>
      </g>
    </g>

    <g transform="translate(0, 160)" class="floating-pill-rev">
      <text x="0" y="22" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" letter-spacing="0.5">
        QGIS • PostGIS • GDAL • MapLibre • GeoPandas • Leaflet • Cesium • STAC • GeoParquet
      </text>
    </g>
  </g>

  <!-- Bottom Accent Aesthetic Border -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#accentGrad)"/>
</svg>