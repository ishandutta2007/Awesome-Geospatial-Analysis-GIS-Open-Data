<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#060913"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#10b981"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".3"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".6" stdDeviation="6"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity=".3"/></pattern><style>@keyframes pulseRing{0%{r:30px;opacity:.8;stroke-width:2.5}50%{opacity:.4}}@keyframes floatPill{0%{transform:translateY(0)}}@keyframes floatPillRev{0%{transform:translateY(0)}}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:46px;fill:#fff}.subtitle-text{font-weight:400;font-size:19px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}.sat-orbit{animation:rotateOrbit 25s linear infinite;transform-origin:980px 210px}.pulse-radar,.pulse-radar-delay{animation:pulseRing 4s cubic-bezier(.215,.61,.355,1) infinite;transform-origin:980px 210px}.pulse-radar-delay{animation:pulseRing 4s cubic-bezier(.215,.61,.355,1) infinite 2s}.floating-pill{animation:floatPill 6s ease-in-out infinite alternate}.floating-pill-rev{animation:floatPillRev 7s ease-in-out infinite alternate}.coord-text{font-family:&apos;SF Mono&apos;,Consolas,Monaco,monospace;font-size:11px;fill:#38bdf8;opacity:.7}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><circle cx="980" cy="210" r="140" fill="url(#glowGrad)"/><circle cx="980" cy="210" r="40" fill="none" stroke="#38bdf8" stroke-width="2" class="pulse-radar"/><circle cx="980" cy="210" r="40" fill="none" stroke="#10b981" stroke-width="1.5" class="pulse-radar-delay"/><g opacity=".4" transform="translate(980, 210)"><circle r="120" fill="none" stroke="#0284c7" stroke-dasharray="4 4" stroke-width="1.5"/><ellipse fill="none" stroke="#0ea5e9" stroke-width="1.2" rx="120" ry="45"/><ellipse fill="none" stroke="#0ea5e9" stroke-width="1.2" rx="45" ry="120"/><circle r="8" fill="#38bdf8" filter="url(#glow)"/><circle r="3" fill="#fff"/></g><g class="sat-orbit"><g transform="translate(980, 90)"><polygon fill="#38bdf8" fill-opacity=".12" points="0 0 -30 60 30 60"/><rect width="20" height="12" x="-10" y="-6" fill="#e2e8f0" rx="2"/><rect width="10" height="6" x="-24" y="-3" fill="#38bdf8" rx="1"/><rect width="10" height="6" x="14" y="-3" fill="#38bdf8" rx="1"/><circle cx="0" cy="0" r="2" fill="#ef4444"/></g></g><path fill="none" stroke="#0284c7" stroke-dasharray="6 4" stroke-opacity=".4" stroke-width="1.5" d="M 60 40 L 140 40 L 180 80 L 320 80"/><circle cx="60" cy="40" r="3.5" fill="#38bdf8"/><circle cx="180" cy="80" r="3.5" fill="#10b981"/><circle cx="320" cy="80" r="3.5" fill="#38bdf8"/><text x="60" y="30" class="coord-text">LAT 37° 46&apos; N LON 122° 25&apos; W | EPSG:4326</text><g filter="url(#subtleShadow)" transform="translate(60, 140)"><g transform="translate(0, -32)"><rect width="210" height="26" fill="#1e293b" stroke="#334155" stroke-width="1" rx="13"/><circle cx="14" cy="13" r="5" fill="#10b981"/><text x="28" y="17.5" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing=".8">GEOSPATIAL &amp; GIS DATA</text></g><text x="0" y="32" class="title-text">Awesome Geospatial Analysis</text><text x="0" y="74" class="subtitle-text">Curated GIS Platforms, Spatial Data Science &amp; Earth Observation</text><g class="floating-pill"><g transform="translate(0, 115) translate(0, 0)"><rect width="145" height="34" fill="#1e293b" stroke="#0284c7" stroke-width="1.2" rx="8"/><text x="14" y="22" class="badge-text">🗺️ Web Mapping</text></g><g transform="translate(0, 115) translate(155, 0)"><rect width="130" height="34" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" rx="8"/><text x="14" y="22" class="badge-text">☁️ Cloud GIS</text></g><g transform="translate(0, 115) translate(295, 0)"><rect width="180" height="34" fill="#1e293b" stroke="#10b981" stroke-width="1.2" rx="8"/><text x="14" y="22" class="badge-text">🛰️ Earth Observation</text></g><g transform="translate(0, 115) translate(485, 0)"><rect width="130" height="34" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" rx="8"/><text x="14" y="22" class="badge-text">🌐 Open Data</text></g></g><g class="floating-pill-rev"><text x="0" y="22" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12" letter-spacing=".5" transform="translate(0, 160)">QGIS • PostGIS • GDAL • MapLibre • GeoPandas • Leaflet • Cesium • STAC • GeoParquet</text></g></g><rect width="1200" height="5" x="0" y="415" fill="url(#accentGrad)"/></svg>